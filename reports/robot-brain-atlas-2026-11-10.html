  ask:'Long-horizon memory architectures under the latency budget of the semantic rung; and a real study of specification error across language, demonstration and goal-image interfaces.'}
];

function viewGaps(){
  return `<div class="prose" style="padding-block:18px 0">
    <p>These are ordered by how tractable they are for one person with access to a low-cost arm, an
    A100-class machine for training and the open checkpoints that now exist — not by how important they
    sound. Each one is anchored in something a company has already admitted in print, because an
    admission is a much better research lead than a claim.</p>
  </div><div style="padding-bottom:36px">
  ${GAPS.map(g=>`<div class="gapcard" style="--k:${g.k}">
    <h3>${g.t}</h3><p class="lede">${g.l}</p>
    <ul class="ev-list">${g.ev.map(e=>`<li>${e}</li>`).join('')}</ul>
    <div class="ask"><strong>The open question:</strong> ${g.ask}</div></div>`).join('')}
  </div>`;
}

function viewMethod(){
  return `<div class="prose" style="padding-block:18px 36px">
    <h3>How to read the evidence badges</h3>
    <p><strong>Primary source</strong> means the architecture and numbers here came from the company's
    own research pages, papers or repositories, read directly. <strong>Company claim</strong> means the
    page exists but gives marketing rather than method. <strong>Undisclosed</strong> means there is
    effectively nothing technical to read — which, for Eka at a $1.45B valuation and Tesla at any
    valuation, is itself the finding.</p>

    <h3>The five bets, stated plainly</h3>
    ${Object.entries(CL).map(([k,v])=>`<p><strong style="color:${v.color}">${v.name}:</strong> ${v.claim}</p>`).join('')}

    <h3>What the sweep actually changed about the picture</h3>
    <ul>
      <li><strong>Sunday's model is not the Action Chunking Transformer.</strong> ACT-1 and ACT-2 never
        cite Zhao et al. or ALOHA; their citations are GPT-1, GPT-3, π0, GEN-0 and GEN-1. Read it as
        "Act One."</li>
      <li><strong>1X's world model is a policy, not an evaluator.</strong> It generates video, extracts
        actions with an inverse dynamics model, and executes them — at 11 seconds per generation,
        offboard.</li>
      <li><strong>Figure 2.5 abandoned the pretrained VLM.</strong> Helix 2.5 trains from random
        initialisation on their own human-behaviour dataset, which quietly contradicts Helix 1's
        internet-pretraining thesis. Zero-shot went 9% → 56% from that change alone.</li>
      <li><strong>π0.6 is at <code>/blog/pistar06</code>, not <code>/pi06</code>,</strong> and is not
        listed on their research index. π*0.6 is the RL-trained result; π0.6 is the 5B base.</li>
      <li><strong>Eka has no technical pages at all.</strong> The &gt;95% grasp and sub-1 kg figures
        circulating in press do not appear on Eka's own site.</li>
      <li><strong>Amazon's headline robotics AI is a traffic model.</strong> DeepFleet predicts fleet
        movement, not manipulation. The Frontier AI &amp; Robotics org name and Pieter Abbeel's
        leadership were not verifiable from Amazon's own pages.</li>
    </ul>

    <h3>Things deliberately not resolved</h3>
    <p>Nature Will's Natura-1 could not be verified at all — the only source returns HTTP 403 and no
    company site was found. Tesla publishes nothing retrievable. Boston Dynamics' widely-reported TRI
    partnership does not appear in Boston Dynamics' own blog. Where a figure is a press report rather
    than a company statement, it is labelled as such rather than quietly promoted.</p>

    <p class="note">Sources are listed on each player's detail panel. Verified 10 November 2026.
    Company performance figures are self-reported unless stated otherwise; none of them has been
    independently replicated, which is the point of the first research gap.</p>
  </div>`;
}

function render(){
  main.innerHTML = view==='map'?viewMap():view==='compare'?viewCompare():
    view==='physics'?viewPhysics():view==='gaps'?viewGaps():viewMethod();
  document.querySelectorAll('.tab').forEach(t=>
    t.setAttribute('aria-selected',String(t.dataset.view===view)));
}

    <span class="ev ${d.ev}">${evLabel[d.ev]}</span>

let dwrap=document.createElement('div');document.body.appendChild(dwrap);

document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(tab){view=tab.dataset.view;render();return}
  const chip=e.target.closest('[data-cl]');
  if(chip){const k=chip.dataset.cl;active.has(k)?active.delete(k):active.add(k);
    if(!active.size)active=new Set(Object.keys(CL));render();return}

    const f=filtered();

// ---------- Claude chat + dictation ----------
const logEl=document.getElementById('log'), qEl=document.getElementById('q'),
      sendEl=document.getElementById('send'), micEl=document.getElementById('mic'),
      stopEl=document.getElementById('stop'), dock=document.querySelector('.dock');
let sampleFn=null, turns=null, ctl=null, busy=false;

function setDockH(){document.body.style.setProperty('--dock-h',dock.offsetHeight+'px')}
new ResizeObserver(setDockH).observe(dock);setDockH();

function digest(){
  return D.map(d=>[
    `## ${d.n} — ${d.m} [${CL[d.c].name}; evidence: ${evLabel[d.ev]}]`,
    `BET: ${d.bet}`,`THESIS: ${d.thesis}`,
    `ARCH: ${d.arch.map(([k,v])=>k+': '+v).join(' | ')}`,
    `PROGRESSION: ${d.prog.map(p=>`${p[0]} (${p[1]}): ${p[2]} ${p[3]&&p[3]!=='—'?'WHY: '+p[3]:''}`).join(' || ')}`,
    `NUMBERS: ${d.nums.map(([k,v])=>k+': '+v).join(' | ')}`,
    `ADMITTED LIMITS: ${d.lim.map(([q,s])=>`"${q}" (${s})`).join(' | ')}`,
    `CEILING: ${d.ceil}`,`RESEARCH OPENING: ${d.gap}`,`SOURCES: ${d.src}`
  ].join('\n')).join('\n\n');
}

function rules(){
  return `You are Claude, helping Anshu — a Stanford student who wants to do frontier research on the
LEARNING side of robotics — think through the robot-foundation-model landscape. He is talking to you
from inside a research tool he asked you to build, called the Robot Brain Atlas. He is not a casual
reader: he has already read a 36,765-word literature review of this field, knows the lineage from
guided policy search through MAML, diffusion policy, action chunking and VLAs, and has a Jetson AGX
Orin with pi0, pi0.5, pi0-FAST, GR00T, wall_x and xvla available in a working LeRobot docker image.
He is choosing a research direction and wants to know where to make the biggest impact.

HOW TO ANSWER HIM:
- Be direct and technical. Skip preamble, skip restating his question, skip flattery.
- Give a recommendation, not a menu of options. If he asks "which of these", pick one and defend it.
- Distinguish clearly between what a company has PUBLISHED, what they CLAIM, and what is UNKNOWN.
  The dataset below marks this; respect it. Never upgrade a claim into a fact.
- Prefer a company's own admitted limitation over its headline number. The admissions are the
  research leads.
- When he asks about a research direction, say what the concrete experiment is, what hardware it
  needs, and what would falsify it.
- Use his actual constraints: one person, a low-cost arm, an A100-class machine for training, a
  Jetson Orin for deployment, open checkpoints only.
- Statistics matter to him. He has been told his comparative advantage is statistical rigour applied
  to robot evaluation. Do not soften weak evidence.
- Keep answers tight — a few short paragraphs or a compact list. He is reading this in a dock at the
  bottom of a page, not a document. No headers unless the answer genuinely needs them.
- If something is not in the dataset below, say you do not know rather than inventing a figure.

THE DATASET (verified 10 Nov 2026; everything you know about these companies for this conversation):

${digest()}`;
}

function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*(?!\s)(.+?)(?<!\s)\*/g,'<em>$1</em>');
}
function bubble(cls,html){
  const el=document.createElement('div');el.className='msg '+cls;
  if(cls==='a')el.innerHTML=html;else el.textContent=html;
  logEl.append(el);logEl.hidden=false;logEl.scrollTop=logEl.scrollHeight;return el;
}
function ctxNote(){
  let n=document.getElementById('ctxn');
  if(!n){n=document.createElement('div');n.id='ctxn';n.className='ctxline';
    logEl.prepend(n)}
  n.textContent=openId?`Context: ${D.find(d=>d.id===openId).n} is open.`:'';
  n.hidden=!openId;
}

async function ask(text){
  if(!sampleFn||busy||!text.trim())return;
  busy=true;sendEl.disabled=true;stopEl.hidden=false;qEl.value='';
  bubble('u',text);
  const focus=openId?`\n\n[He currently has ${D.find(d=>d.id===openId).n} open in the atlas — assume that is the subject unless he says otherwise.]`:'';
  turns.push({role:'user',content:text+focus});
  const out=bubble('a','');out.textContent='Thinking…';
  ctl=new AbortController();
  try{
    const {text:ans}=await sampleFn([{role:'user',content:rules()},...turns],{
      cache:false,signal:ctl.signal,modelTier:'complex',
      onText:({text})=>{out.innerHTML=md(text);logEl.scrollTop=logEl.scrollHeight}});
    turns.push({role:'assistant',content:ans});
    if(turns.length>14)turns.splice(0,2);
  }catch(err){
    const keep=err.text?md(err.text):'';
    const copy={cancelled:'Stopped.',not_granted:'You declined Claude access for this page — ask again from the Permissions menu if you change your mind.',
      rate_limited:'Rate limited. Give it a minute and ask again.',
      session_expired:'Your session expired — sign in again.',
      refused:'Claude declined that one. Try rephrasing.',
      prompt_too_large:'That conversation got too long. Reload to start fresh.',
      empty_completion:'No answer came back. Ask for less at a time.'}[err.code]
      || 'Something went wrong reaching Claude. Try again.';
    out.innerHTML = keep ? keep+`<div class="msg sys" style="margin-top:8px">${copy}</div>` : '';
    if(!keep){out.className='msg sys';out.textContent=copy}
    if(err.code==='not_granted'||err.code==='sampling_disabled'){sampleFn=null;
      qEl.disabled=true;qEl.placeholder='Claude is not available on this page.'}
    if(err.code!=='cancelled')turns.pop();
  }finally{busy=false;sendEl.disabled=false;stopEl.hidden=true;ctl=null}
}

sendEl.addEventListener('click',()=>ask(qEl.value));
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(qEl.value)}});
stopEl.addEventListener('click',()=>ctl?.abort());

(async()=>{
  sampleFn = await claude.use('sample');
  if(!sampleFn){qEl.disabled=true;sendEl.disabled=true;
    qEl.placeholder='Open this on claude.ai to ask Claude from the page.';return}
  turns=[];
  const hint=document.createElement('div');hint.className='hint';
  hint.innerHTML='<span>Try:</span>';
  [['Which gap should I actually start on?','Which of the research gaps should I actually start on, given one arm and one A100?'],
   ['Pi vs Eka — who is right?','Physical Intelligence bets on imitation plus on-robot RL; Eka bets on sim RL with force and no demos. Who is more likely to be right, and what experiment would settle it?'],
   ['Is the 7B ossification claim credible?','How credible is Generalist\'s 7B ossification threshold, and how would I replicate it on open models?'],
   ['Why is everything so slow?','Explain why the semantic layer runs at 5-10Hz and what that actually forces architecturally.']
  ].forEach(([label,prompt])=>{
    const b=document.createElement('button');b.textContent=label;
    b.onclick=()=>ask(prompt);hint.append(b)});
  logEl.prepend(hint);logEl.hidden=false;ctxNote();setDockH();

  const dict = await claude.use('dictation');
  if(!dict)return;
  micEl.hidden=false;setDockH();
  let base='';
  dict.onPartial(({text})=>{qEl.value=(base+' '+text).trim()});
  dict.onFinal(({text})=>{base=(base+text);qEl.value=base.trim()});
  dict.onState(({state,reason})=>{
    const on=state==='listening'||state==='starting';
    micEl.setAttribute('aria-pressed',String(on));
    micEl.title=on?'Stop listening':'Speak';
    if(state==='idle'&&reason&&!['stopped','viewer_stopped'].includes(reason)){
      if(['not_granted','unavailable'].includes(reason)){micEl.hidden=true;setDockH()}
    }
  });
  micEl.addEventListener('click',()=>{
    if(dict.active()){dict.stop();return}
    base=qEl.value?qEl.value+' ':'';
    dict.start().catch(err=>{
      if(err.code==='not_granted'||err.code==='unavailable'){micEl.hidden=true;setDockH()}
    });
  });
})();
</script>
